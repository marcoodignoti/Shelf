<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CSP is enforced via Content-Security-Policy header injected by
         electron/main.cjs (handleAppProtocolRequest). Do NOT add a <meta>
         CSP here — dual policies are AND'd per the CSP spec, so a restrictive
         meta tag would block resources the header explicitly allows. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shelf</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
