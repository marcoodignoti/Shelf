name: Feedback
description: Share quick feedback after using a release.
title: "[Feedback]: "
labels: ["feedback", "needs-triage"]
body:
  - type: input
    id: version
    attributes:
      label: Version used
      placeholder: v0.2.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Both
  - type: textarea
    id: tested
    attributes:
      label: What did you use?
      placeholder: Notes, formulas, PDF Studio, install/open, reopen app...
    validations:
      required: true
  - type: textarea
    id: good
    attributes:
      label: What worked well?
  - type: textarea
    id: problems
    attributes:
      label: Problems or rough edges
      description: Include screenshots if helpful.
