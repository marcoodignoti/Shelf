name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  electron:
    name: Electron build, test, audit
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-node-${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-node-${{ env.NODE_VERSION }}-
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: E2E tests
        run: npm run e2e

      - name: Electron check
        run: npm run check:electron

  windows-package:
    name: Windows package
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test

      - name: Electron backend smoke
        run: npm run electron:smoke

      - name: Electron runtime smoke
        run: npm run electron:smoke:runtime

      - name: Package Windows app
        run: npm run release:package:windows

      - name: Zip Windows package
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          Compress-Archive -Path dist-electron/win-x64/OpenNotion/* -DestinationPath "dist-electron/OpenNotion_${version}_win-x64.zip" -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: OpenNotion_win-x64
          path: dist-electron/OpenNotion_*_win-x64.zip
          if-no-files-found: error

      - name: Authenticode dry run
        shell: pwsh
        timeout-minutes: 5
        run: |
          $exePath = "dist-electron/win-x64/OpenNotion/OpenNotion.exe"
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=OpenNotion CI Authenticode Dry Run" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -KeyExportPolicy Exportable `
            -KeyUsage DigitalSignature
          $signature = Set-AuthenticodeSignature -FilePath $exePath -Certificate $cert -HashAlgorithm SHA256
          if ($signature.Status -eq "NotSigned") {
            throw "Authenticode dry run did not sign OpenNotion.exe"
          }
          if ($signature.SignerCertificate.Subject -ne "CN=OpenNotion CI Authenticode Dry Run") {
            throw "Authenticode dry run signer mismatch"
          }

      - name: Package Windows installer
        run: npm run release:package:windows:installer

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: OpenNotion_win-x64_installer
          path: |
            dist-electron/builder/OpenNotion_*_setup_win-x64.exe
            dist-electron/builder/OpenNotion_*_setup_win-x64.exe.blockmap
            dist-electron/builder/latest.yml
          if-no-files-found: error

  macos-package:
    name: macOS package
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package macOS app
        run: npm run release:package:macos

      - name: Upload macOS package
        uses: actions/upload-artifact@v7
        with:
          name: OpenNotion_macos-arm64
          path: dist-electron/OpenNotion_*_arm64.dmg
          if-no-files-found: error
