name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
      run_id:
        description: CI run ID that produced the release artifacts.
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download CI artifacts
        run: gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --dir artifacts

      - name: Upload assets
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          # latest.yml and the blockmap ship together with the installer:
          # electron-updater reads latest.yml to discover the update and the
          # blockmap to download only the changed blocks (differential update)
          # instead of the full installer.
          gh release upload "$tag" \
            artifacts/OpenNotion_macos-arm64/OpenNotion_*_arm64.dmg \
            artifacts/OpenNotion_win-x64/OpenNotion_*_win-x64.zip \
            artifacts/OpenNotion_win-x64_installer/OpenNotion_*_setup_win-x64.exe \
            artifacts/OpenNotion_win-x64_installer/OpenNotion_*_setup_win-x64.exe.blockmap \
            artifacts/OpenNotion_win-x64_installer/latest.yml \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish draft release
        run: gh release edit "${{ inputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
