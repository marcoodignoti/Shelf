name: Publish release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
      run_id:
        description: CI run ID that produced the release artifacts.
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate CI run provenance
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          run_id="${{ inputs.run_id }}"
          run_json="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}")"
          run_repo="$(jq -r '.repository.full_name' <<<"$run_json")"
          run_event="$(jq -r '.event' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          run_head_sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_workflow="$(jq -r '.name' <<<"$run_json")"
          git check-ref-format --allow-onelevel "$tag"
          git fetch --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}"
          release_sha="$(git rev-list -n 1 "$tag")"
          if [ "$run_repo" != "${{ github.repository }}" ]; then
            echo "CI run belongs to $run_repo, not ${{ github.repository }}" >&2
            exit 1
          fi
          if [ "$run_workflow" != "CI" ] || [ "$run_event" != "push" ] || [ "$run_head_branch" != "main" ]; then
            echo "CI run must be the CI workflow from a push to main" >&2
            exit 1
          fi
          if [ "$run_conclusion" != "success" ]; then
            echo "CI run conclusion is $run_conclusion, not success" >&2
            exit 1
          fi
          if [ "$run_head_sha" != "$release_sha" ]; then
            echo "CI run SHA $run_head_sha does not match release target $release_sha" >&2
            exit 1
          fi

      - name: Download CI artifacts
        run: gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --dir artifacts

      - name: Build signed beta update manifest
        env:
          SHELF_UPDATE_PRIVATE_KEY_PEM: ${{ secrets.SHELF_UPDATE_PRIVATE_KEY_PEM || secrets.OPENNOTION_UPDATE_PRIVATE_KEY_PEM }}
          SHELF_UPDATE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${SHELF_UPDATE_PRIVATE_KEY_PEM:-}" ]; then
            echo "SHELF_UPDATE_PRIVATE_KEY_PEM not set; skipping beta-update.json"
            exit 0
          fi
          mkdir -p dist-electron
          cp artifacts/Shelf_macos-arm64/Shelf_*_arm64.dmg dist-electron/
          cp artifacts/Shelf_win-x64/Shelf_*_win-x64.zip dist-electron/
          cp artifacts/Shelf_win-x64_installer/Shelf_*_setup_win-x64.exe dist-electron/
          node scripts/write-beta-update-manifest.cjs

      - name: Upload assets
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          assets=(
              artifacts/Shelf_macos-arm64/Shelf_*_arm64.dmg \
              artifacts/Shelf_win-x64/Shelf_*_win-x64.zip \
              artifacts/Shelf_win-x64_installer/Shelf_*_setup_win-x64.exe \
              artifacts/Shelf_win-x64_installer/Shelf_*_setup_win-x64.exe.blockmap
            )
          if [ -f dist-electron/beta-update.json ]; then
            assets+=(dist-electron/beta-update.json)
          fi
          gh release upload "$tag" "${assets[@]}" \
            --repo "${{ github.repository }}" \
            --clobber

      - name: Publish draft release
        run: gh release edit "${{ inputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
