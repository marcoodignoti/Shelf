name: Deploy landing page

on:
  push:
    branches: [main]
    paths:
      - 'docs/site/**'
      - 'docs/assets/**'
      - 'assets/app-icon.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          mkdir -p deploy/assets deploy/vendor
          # Landing page + vendored JS (GSAP, no build step)
          cp -v docs/site/index.html              deploy/index.html
          cp -v docs/site/vendor/gsap.min.js      deploy/vendor/
          cp -v docs/site/vendor/ScrollTrigger.min.js deploy/vendor/
          # Screenshots actually referenced by the landing
          cp -v docs/assets/shelf-editor.png          deploy/assets/
          cp -v docs/assets/shelf-studio-pdf.png      deploy/assets/
          cp -v docs/assets/shelf-detail-formula.png  deploy/assets/
          cp -v docs/assets/shelf-detail-table.png    deploy/assets/
          cp -v docs/assets/shelf-detail-code.png     deploy/assets/
          cp -v docs/assets/shelf-social-preview.png  deploy/assets/
          # Demo video (WebM for <video>, GIF as fallback)
          cp -v docs/assets/shelf-demo.webm deploy/assets/
          cp -v docs/assets/shelf-demo.gif  deploy/assets/
          # App icon (favicon / brand)
          cp -v assets/app-icon.png deploy/assets/
          # Self-hosted Inter variable font (subsetted, ~130KB)
          cp -v docs/assets/Inter-Variable.woff2 deploy/assets/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
