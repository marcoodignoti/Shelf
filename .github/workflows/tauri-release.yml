name: Tauri Beta Release

on:
  push:
    tags:
      - "v*-beta.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing beta tag to release, for example v0.1.0-beta.1"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "22"

jobs:
  publish:
    name: Build ${{ matrix.platform }} bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: --target aarch64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "OpenNotion ${{ inputs.tag || github.ref_name }}"
          releaseBody: |
            Unsigned OpenNotion Tauri beta.

            Expect OS trust warnings:
            - macOS: app is not notarized.
            - Windows: installer is not code-signed and may trigger SmartScreen.

            Test before relying on this build for real work.
          releaseDraft: false
          prerelease: true
          args: ${{ matrix.args }}
