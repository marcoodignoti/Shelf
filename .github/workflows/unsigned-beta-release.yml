name: Unsigned Native Beta Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0-beta.1"
        required: true
        type: string
  push:
    tags:
      - "v*-beta*"

permissions:
  contents: write

concurrency:
  group: unsigned-native-beta-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    name: Build unsigned native macOS beta
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Swift version
        run: swift --version

      - name: Native release contract
        run: scripts/test-native-release-pipeline.sh

      - name: Build unsigned native bundle
        run: SIGNING_IDENTITY=- NOTARIZE=false scripts/package-native-macos.sh

      - name: Verify unsigned native bundle
        run: scripts/verify-native-macos-release.sh

      - name: Upload unsigned native artifact
        uses: actions/upload-artifact@v4
        with:
          name: opennotion-macos-native-unsigned
          path: |
            dist/native-release/OpenNotion.app
            dist/native-release/OpenNotion_*.dmg
          if-no-files-found: error

  release:
    name: Publish unsigned native beta release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download unsigned artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create unsigned native beta release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Unsigned Native macOS Beta Build

          This artifact is built from the native SwiftUI macOS app. It is ad-hoc signed for private testing and is not notarized.

          ### macOS

          Gatekeeper may show an unidentified developer warning or a "damaged and can't be opened" message after browser download.

          For private testing:

          1. Copy `OpenNotion.app` to `/Applications`.
          2. Run:

             ```sh
             xattr -dr com.apple.quarantine /Applications/OpenNotion.app
             ```

          3. Open OpenNotion from `/Applications`.

          Production public distribution still requires Developer ID signing and notarization through the `macOS Release` workflow.
          EOF

      - name: Prepare release asset list
        run: |
          find release-artifacts -type f -name 'OpenNotion_*.dmg' -print | sort > release-assets.txt
          test -s release-assets.txt
          cat release-assets.txt

      - name: Create GitHub prerelease
        run: |
          gh release create "$RELEASE_TAG" $(cat release-assets.txt) \
            --title "OpenNotion ${RELEASE_TAG} unsigned native macOS beta" \
            --notes-file release-notes.md \
            --prerelease
